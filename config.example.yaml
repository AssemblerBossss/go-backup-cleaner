# Глобальные настройки — применяются ко всем targets, если target их
# явно не переопределяет.
concurrency: 4
max_concurrency: 4
time_window: 5m

targets:
  # 1) Режим "свободное место": держать не менее N ГБ свободными на диске.
  #    Самый распространённый режим для backup-хранилищ.
  - path: ./backups/db
    min_free_space_gb: 10
    remove_empty_dirs: true
    exclude_extensions: [.lock, .tmp]

  # 2) Режим "процент использования": чистить, пока занято не станет
  #    меньше max_usage_percent. Полезно, когда диск общий с другими сервисами.
  - path: ./backups/media
    max_usage_percent: 85
    exclude_dirs: [.git, node_modules]

  # 3) Режим "максимальный размер каталога": не зависит от статистики
  #    диска (df/statfs) — годится для сетевых томов, где она недоступна.
  - path: ./backups/logs
    max_size_gb: 50
    remove_empty_dirs: false

  # 4) Режим "по возрасту" (max_age) без триггера — безусловно удаляем
  #    всё старше указанного срока, независимо от занятого места.
  #    Поддерживаются time.ParseDuration ("720h") и суффиксы d/w.
  - path: ./backups/archive
    max_age: 30d
    exclude_extensions: [.keep]

  # 5) Режим "по возрасту" с триггером по размеру (age_trigger_size_gb):
  #    удаление старше max_age запускается, только если сам каталог
  #    весит больше порога — иначе target пропускается целиком.
  - path: ./backups/snapshots
    max_age: 4w
    age_trigger_size_gb: 20
    remove_empty_dirs: true

  # 6) Свой time_window (переопределяет глобальный) + dry_run: true —
  #    ничего не удаляется физически, только логируется, что было бы удалено.
  #    Удобно для первого прогона на новом target.
  - path: ./backups/staging
    max_age: 12h
    time_window: 1m
    dry_run: true
    exclude_dirs: [tmp]
    exclude_extensions: [.part, .tmp]

  # 7) Минимальный вариант: только обязательное поле ёмкости (max_age),
  #    все остальные настройки — дефолты библиотеки
  #    (remove_empty_dirs: true, time_window глобальный, dry_run: false).
  - path: ./backups/minimal
    max_age: 90d
